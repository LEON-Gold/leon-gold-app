<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>اینستاگرام لئون گلد</title>
<!-- The owner's Instagram page, opened from the ledger's menu. Emptied on 2026-11-09 (owner: the old plan is not used;
     a new Instagram plan comes later). The old content stays in the leon-gold-social folder and in this repo's history. -->
<script>try{var t=localStorage.getItem("leon-theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#e9e5da;--card:#fffdf6;--ink:#12241b;--muted:#5f6a5e;--gold:#c59a50;--gold-lt:#e8cf8e;--green:#0d3a2a}
:root[data-theme="dark"]{--bg:#040b08;--card:#0d1c15;--ink:#f4ecd8;--muted:#cfc7b0;--green:#e8cf8e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 80% at 50% 0%,#0f4030,#06140e 70%);font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink)}
.card{width:min(420px,100%);background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:34px 26px;text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
:root[data-theme="dark"] .card{background:radial-gradient(130% 70% at 50% -10%,rgba(232,207,142,.1),transparent 55%),linear-gradient(180deg,#102219,#0a1610)}
.ic{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#f3dfa4,#b88a3e);color:#0a1f15}
.ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8}
h1{margin:0 0 8px;font-size:22px;color:var(--green)}
p{margin:0;color:var(--muted);line-height:1.9;font-size:15px}
</style>
</head>
<body>
<main class="card">
  <div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg></div>
  <h1>اینستاگرام لئون گلد</h1>
  <p>این بخش فعلاً خالی است. برنامه‌ی تازه‌ی اینستاگرام به‌زودی همین‌جا می‌آید.</p>
</main>
</body>
</html>
