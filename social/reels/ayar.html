<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>ریلز: عیار ۷۵۰ یعنی چه؟</title>
<!-- Reel «عیار ۷۵۰ یعنی چه؟» (owner, 2026-11-09: "the hash explainer" style: dark and gold, one idea drawn step by step,
     words appear one by one with the key word boxed in gold). 40 s, 1080×1920. Rendered to out/reel-ayar.mp4 by scripts/reel.mjs.
     Facts only: 18 karat = 750 parts in 1000 = 75% gold; the rest (copper, silver) makes it hard; 24 karat is pure and soft. -->
<style>
@font-face { font-family: "LG Naskh"; font-weight: 700; src: url(../fonts/amiri-700-arabic.woff2) format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 100 900; src: url(../fonts/vazirmatn-5.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Vazirmatn"; font-weight: 100 900; src: url(../fonts/vazirmatn-4.woff2) format("woff2"); unicode-range: U+0600-06FF, U+200C-200F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Cinzel"; font-weight: 400 900; src: url(../fonts/cinzel-2.woff2) format("woff2"); }
:root { --gold: #e8cf8e; --gold2: #c9a24e; --deep: #9c7433; --ink: #f4ead2; --mut: #a9b5ad; --cu: #b8734a; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #040c08; }
body { font-family: Vazirmatn, sans-serif; color: var(--ink); position: relative;
  background: radial-gradient(900px 700px at 50% 42%, #0f3524 0%, #07190f 55%, #030906 100%); }
body::before { content: ""; position: absolute; inset: 0; opacity: .07;
  background-image: linear-gradient(#e8cf8e 1px, transparent 1px), linear-gradient(90deg, #e8cf8e 1px, transparent 1px); background-size: 54px 54px; }
.top { position: absolute; top: 96px; left: 0; right: 0; text-align: center; font: 600 30px/1 Cinzel, serif; letter-spacing: .32em; color: var(--gold2); }
.top b { font: 700 30px/1 Vazirmatn; letter-spacing: 0; color: var(--mut); margin-inline-start: 18px; }
#cap { position: absolute; top: 210px; left: 70px; right: 70px; min-height: 200px; text-align: center; font: 800 70px/1.45 Vazirmatn; }
#cap .w { opacity: 0; display: inline-block; transition: none; }
#cap .w.on { opacity: 1; }
#cap .hl { color: var(--gold); border: 3px solid var(--gold2); border-radius: 14px; padding: 0 16px; background: rgba(232,207,142,.08); box-shadow: 0 0 40px rgba(232,207,142,.18); }
.sc { position: absolute; left: 0; right: 0; top: 480px; height: 1150px; display: grid; place-items: center; }
.card { background: linear-gradient(180deg, #0d2419, #091a12); border: 2px solid rgba(232,207,142,.28); border-radius: 34px; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
.foot { position: absolute; bottom: 92px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; color: var(--mut); font: 600 30px/1 Vazirmatn; }
.foot img { height: 60px; }
.foot span { font: 700 30px/1 Cinzel; letter-spacing: .2em; color: var(--gold2); }
.big { font: 700 340px/1 "LG Naskh", serif; background: linear-gradient(180deg, #fff3cf, #e8cf8e 40%, #b88a3a 75%, #f3dfa4); -webkit-background-clip: text; color: transparent; filter: drop-shadow(0 18px 40px rgba(0,0,0,.6)); }
.stamp { position: absolute; width: 640px; height: 420px; border: 6px solid rgba(232,207,142,.55); border-radius: 50%; }
.sub { font: 600 40px/1.4 Vazirmatn; color: var(--mut); }
.legend { display: flex; gap: 34px; justify-content: center; margin-top: 40px; font: 700 42px/1 Vazirmatn; }
.legend i { display: inline-block; width: 34px; height: 34px; border-radius: 8px; vertical-align: -6px; margin-inline-end: 12px; }
.legend b { font-variant-numeric: tabular-nums; }
.bars { width: 900px; padding: 56px 60px; display: grid; gap: 54px; }
.bar .l { display: flex; justify-content: space-between; font: 800 46px/1 Vazirmatn; margin-bottom: 20px; }
.bar .l em { font-style: normal; color: var(--gold); }
.bar .t { height: 64px; border-radius: 18px; background: rgba(255,255,255,.06); overflow: hidden; display: flex; }
.bar .g { background: linear-gradient(90deg, #b88a3a, #f3dfa4, #c9a24e); height: 100%; }
.bar .c { background: linear-gradient(90deg, #8a4f30, #c9845a); height: 100%; }
.eq { display: flex; gap: 26px; align-items: center; flex-direction: column; }
.chip { font: 800 76px/1 Vazirmatn; padding: 34px 56px; border-radius: 30px; border: 3px solid var(--gold2); background: rgba(232,207,142,.08); color: var(--gold); }
.chip.k { font-family: "LG Naskh"; font-size: 110px; padding: 24px 60px; }
.eqs { font: 800 70px/1 Vazirmatn; color: var(--mut); }
.cta { display: grid; justify-items: center; gap: 34px; }
.cta img { height: 420px; filter: drop-shadow(0 20px 50px rgba(0,0,0,.6)); }
.cta .n { font: 700 64px/1 Cinzel; letter-spacing: .3em; color: var(--gold); }
.pill { font: 800 54px/1 Vazirmatn; color: #0a1f15; background: linear-gradient(90deg, #c9a24e, #f3dfa4, #c9a24e); padding: 30px 60px; border-radius: 999px; box-shadow: 0 0 60px rgba(232,207,142,.35); }
</style>
</head>
<body>
<div class="top">LEON GOLD<b>— دانستنی طلا</b></div>
<div id="cap"></div>

<!-- 1. the hook: the number stamped on the piece -->
<div class="sc" data-a="0" data-b="5">
  <div class="stamp" data-t="0.1" data-fx="pop"></div>
  <div class="big" data-t="0.3" data-fx="pop">۷۵۰</div>
</div>

<!-- 2. a thousand parts: 750 gold, 250 copper and silver -->
<div class="sc" data-a="5" data-b="16">
  <div>
    <div class="card" data-t="0.1" style="padding:40px"><canvas id="grid" width="900" height="563"></canvas></div>
    <div class="legend" data-t="2.6"><span><i style="background:linear-gradient(135deg,#f3dfa4,#b88a3a)"></i>طلای خالص <b id="ng">۰</b></span><span><i style="background:#b8734a"></i>مس و نقره <b id="nc">۰</b></span></div>
  </div>
</div>

<!-- 3. why not pure: pure gold is soft -->
<div class="sc" data-a="16" data-b="23">
  <svg width="760" height="760" viewBox="0 0 760 760" data-t="0.1" data-fx="pop">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset=".45" stop-color="#e8cf8e"/><stop offset=".8" stop-color="#a87a2e"/><stop offset="1" stop-color="#f3dfa4"/></linearGradient></defs>
    <g id="ring" transform-origin="380 380"><ellipse cx="380" cy="380" rx="250" ry="250" fill="none" stroke="url(#gg)" stroke-width="64"/></g>
    <g id="scr" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-linecap="round" opacity="0">
      <path d="M190 250 l60 -26"/><path d="M520 180 l50 30"/><path d="M600 470 l-30 52"/><path d="M200 520 l46 34"/></g>
    <text x="380" y="395" text-anchor="middle" font-family="Vazirmatn" font-weight="800" font-size="64" fill="#a9b5ad">۲۴ عیار</text>
  </svg>
</div>

<!-- 4. the scale: 24 karat against 18 karat -->
<div class="sc" data-a="23" data-b="30">
  <div class="card bars" data-t="0.1">
    <div class="bar"><div class="l"><span>۲۴ عیار</span><em>خالص، ۱۰۰۰ از ۱۰۰۰</em></div><div class="t"><div class="g" id="b24" style="width:0"></div></div></div>
    <div class="bar" data-t="3.4"><div class="l"><span>۱۸ عیار</span><em>۷۵۰ از ۱۰۰۰</em></div><div class="t"><div class="g" id="b18" style="width:0"></div><div class="c" id="b18c" style="width:0"></div></div></div>
  </div>
</div>

<!-- 5. so: 750 = 18 karat = 75% gold -->
<div class="sc" data-a="30" data-b="34.6">
  <div class="eq">
    <div class="chip k" data-t="0.2" data-fx="pop">۷۵۰</div>
    <div class="eqs" data-t="0.8">=</div>
    <div class="chip" data-t="1.1" data-fx="pop">۱۸ عیار</div>
    <div class="eqs" data-t="1.7">=</div>
    <div class="chip" data-t="2" data-fx="pop">۷۵٪ طلا</div>
  </div>
</div>

<!-- 6. ask the next question -->
<div class="sc" data-a="34.6" data-b="40.2">
  <div class="cta">
    <img src="../img/leaf.png" alt="" data-t="0.1" data-fx="pop">
    <div class="n" data-t="0.6">LEON GOLD</div>
    <div class="pill" data-t="1.2" data-fx="pop">سؤال بعدی‌ات را کامنت کن</div>
  </div>
</div>

<div class="foot"><span dir="ltr">@___leongold___</span></div>

<script src="reel.js"></script>
<script>
window.LEN = 40;
window.CAPS = [
  [0.2, 2.7, "روی طلات نوشته *۷۵۰*"],
  [2.7, 5, "یعنی *چی*؟"],
  [5, 8.1, "طلا رو *هزار* تکه کن"],
  [8.1, 12, "*۷۵۰* تکه‌اش طلای *خالصه*"],
  [12, 16, "*۲۵۰* تکه مس و نقره"],
  [16, 19.4, "چرا؟ طلای *خالص* نرمه"],
  [19.4, 23, "خط می‌افته، *خم* می‌شه"],
  [23, 26.4, "۲۴ عیار یعنی *خالص*"],
  [26.4, 30, "۱۸ عیار یعنی *۷۵۰* از هزار"],
  [30, 34.6, "پس *۷۵۰* یعنی *۱۸* عیار"],
  [34.6, 40.2, "سؤالت رو *کامنت* کن"],
];
// the grid: 40 × 25 = 1000 cells, filled in a fixed shuffled order
const cv = document.getElementById("grid"), cx = cv.getContext("2d"), COLS = 40, ROWS = 25, W = 900 / COLS, H = 563 / ROWS;
const order = [...Array(1000).keys()]; let sd = 7; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
const gold = cx.createLinearGradient(0, 0, 900, 563); gold.addColorStop(0, "#f3dfa4"); gold.addColorStop(.5, "#d4ad5c"); gold.addColorStop(1, "#b88a3a");
HOOKS.push(t => {
  const ng = Math.round(750 * R.ease(R.p(t, 8.4, 3.2))), nc = Math.round(250 * R.ease(R.p(t, 12.3, 2.2)));
  cx.clearRect(0, 0, 900, 563);
  for (let k = 0; k < 1000; k++) {
    const i = order[k], x = (i % COLS) * W, y = Math.floor(i / COLS) * H;
    cx.fillStyle = k < ng ? gold : k >= 750 && k < 750 + nc ? "#b8734a" : "rgba(255,255,255,.07)";
    cx.fillRect(x + 2, y + 2, W - 4, H - 4);
  }
  document.getElementById("ng").textContent = fa(ng); document.getElementById("nc").textContent = fa(nc);
  // the soft ring: pressed, it gives; then the scratches
  const s = Math.sin(R.p(t, 18.2, 2.2) * Math.PI * 2) * (1 - R.p(t, 18.2, 2.2)) * .32;
  document.getElementById("ring").setAttribute("transform", `scale(${1 + s} ${1 - s})`);
  document.getElementById("scr").setAttribute("opacity", R.ease(R.p(t, 20, .6)));
  // the bars
  document.getElementById("b24").style.width = 100 * R.ease(R.p(t, 23.6, 1.4)) + "%";
  document.getElementById("b18").style.width = 75 * R.ease(R.p(t, 26.6, 1.4)) + "%";
  document.getElementById("b18c").style.width = 25 * R.ease(R.p(t, 27.9, .8)) + "%";
});
</script>
</body>
</html>
