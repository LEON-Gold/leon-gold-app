<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>ریلز: قبل از خرید طلا سه چیز را بپرس</title>
<!-- Reel «قبل از خرید، این سه تا رو بپرس» (owner, 2026-11-09: the collage storytelling style: torn paper, a path that
     leads the eye, big one-word captions). 38.5 s, 1080×1920, Leon's greens and gold instead of purple.
     Rendered to out/reel-safar.mp4 by scripts/reel.mjs. The photo is Leon's own («آویز اشک», site products).
     Advice only: no prices, weights or promises; the price formula is the market's: gold × weight + wage + profit + tax. -->
<style>
@font-face { font-family: "LG Naskh"; font-weight: 700; src: url(../fonts/amiri-700-arabic.woff2) format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 100 900; src: url(../fonts/vazirmatn-5.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Vazirmatn"; font-weight: 100 900; src: url(../fonts/vazirmatn-4.woff2) format("woff2"); unicode-range: U+0600-06FF, U+200C-200F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Cinzel"; font-weight: 400 900; src: url(../fonts/cinzel-2.woff2) format("woff2"); }
:root { --gold: #e8cf8e; --gold2: #c9a24e; --paper: #f4ead2; --paper2: #e6d6ad; --ink: #2a2116; --em: #0f3524; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { position: relative; font-family: Vazirmatn, sans-serif; color: var(--ink);
  background: radial-gradient(800px 900px at 30% 30%, #173f2b, transparent 70%), radial-gradient(700px 800px at 80% 80%, #2b1d10, transparent 70%), #0b1a12; }
/* scraps of torn paper scattered behind everything */
.bgs { position: absolute; inset: 0; }
.bgs i { position: absolute; background: #1d3a2a; opacity: .55; }
.paper { position: absolute; background: linear-gradient(160deg, var(--paper), var(--paper2)); box-shadow: 0 30px 60px rgba(0,0,0,.55); }
.paper::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 20% 15%, rgba(156,116,51,.18), transparent 40%), radial-gradient(circle at 85% 90%, rgba(120,80,30,.22), transparent 45%); pointer-events: none; }
.ph { position: absolute; inset: 34px; background-size: cover; background-position: center 35%; border: 2px solid rgba(42,33,22,.25); }
.tag { position: absolute; display: grid; place-items: center; font: 800 78px/1 Vazirmatn; color: var(--ink); }
.tag small { display: block; font: 600 34px/1.3 Vazirmatn; color: #6b5636; margin-top: 10px; text-align: center; }
.num { position: absolute; top: 22px; right: 22px; width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, #f3dfa4, #b88a3a); color: #0a1f15; font: 800 46px/1 Vazirmatn; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
.hd { position: absolute; top: 100px; left: 0; right: 0; text-align: center; font: 700 32px/1 Cinzel, serif; letter-spacing: .3em; color: var(--gold2); }
#cap { position: absolute; left: 40px; right: 40px; bottom: 300px; text-align: center; font: 900 122px/1.2 Vazirmatn; color: #fff;
  text-shadow: 0 0 2px #000, 0 6px 0 rgba(0,0,0,.85), 0 0 30px rgba(0,0,0,.9); -webkit-text-stroke: 3px rgba(0,0,0,.85); paint-order: stroke fill; }
#cap .w { display: none; }
#cap .w.now { display: inline-block; }
#cap .hl { color: var(--gold); }
.sc { position: absolute; inset: 0; }
.formula { font: 800 60px/1.6 Vazirmatn; text-align: center; padding: 70px 50px; }
.formula b { display: inline-block; padding: 0 18px; border-radius: 14px; background: rgba(15,53,36,.1); border: 3px solid rgba(15,53,36,.35); margin: 6px 4px; }
.formula b.g { background: #0f3524; color: var(--gold); border-color: #0f3524; }
.bub { position: absolute; background: #fff; border-radius: 40px 40px 8px 40px; padding: 26px 34px; font: 700 42px/1.3 Vazirmatn; color: #1b1b1b; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
.bub.me { background: linear-gradient(135deg, #e8cf8e, #c9a24e); border-radius: 40px 40px 40px 8px; color: #0a1f15; }
.cta { position: absolute; top: 470px; left: 0; right: 0; display: grid; justify-items: center; gap: 30px; }
.cta img { height: 420px; filter: drop-shadow(0 20px 50px rgba(0,0,0,.6)); }
.cta .n { font: 700 64px/1 Cinzel; letter-spacing: .3em; color: var(--gold); }
.pill { font: 800 50px/1 Vazirmatn; color: #0a1f15; background: linear-gradient(90deg, #c9a24e, #f3dfa4, #c9a24e); padding: 30px 56px; border-radius: 999px; box-shadow: 0 0 60px rgba(232,207,142,.35); }
.foot { position: absolute; bottom: 92px; left: 0; right: 0; text-align: center; font: 700 30px/1 Cinzel; letter-spacing: .2em; color: var(--gold2); }
</style>
</head>
<body>
<div class="bgs" id="bgs"></div>
<div class="hd">LEON GOLD</div>
<!-- the gold path that runs through the whole story -->
<svg style="position:absolute;inset:0" width="1080" height="1920" viewBox="0 0 1080 1920" id="pathsvg">
  <path id="gpath" d="M-40 1330 C 200 1250, 260 1420, 520 1360 S 900 1180, 1120 1260" fill="none" stroke="#e8cf8e" stroke-width="12" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="1400" opacity=".9"/>
</svg>

<!-- 1. you saw a piece and fell for it -->
<div class="sc" data-a="0" data-b="5.6">
  <div class="paper torn" data-t="0.05" data-fx="pop" data-r="-4" style="left:150px;top:300px;width:780px;height:960px"><div class="ph" style="background-image:url(../img/earring-drop-1.webp)"></div></div>
  <div class="paper torn tag" data-t="1.4" data-fx="pop" data-r="10" style="left:90px;top:1060px;width:250px;height:170px">؟</div>
  <svg data-t="2.6" data-fx="pop" style="position:absolute;left:700px;top:1080px" width="230" height="230" viewBox="0 0 100 100"><path d="M50 86 C 10 60, 8 30, 28 22 C 40 17, 48 26, 50 32 C 52 26, 60 17, 72 22 C 92 30, 90 60, 50 86 Z" fill="#c9a24e" stroke="#f3dfa4" stroke-width="3"/></svg>
</div>

<!-- 2. before you buy: three things -->
<div class="sc" data-a="5.6" data-b="11.1">
  <div class="paper torn tag" data-t="0.3" data-fx="pop" data-r="-6" style="left:600px;top:420px;width:380px;height:300px"><span class="num">۱</span>عیار</div>
  <div class="paper torn tag" data-t="0.9" data-fx="pop" data-r="5" style="left:110px;top:640px;width:380px;height:300px"><span class="num">۲</span>وزن</div>
  <div class="paper torn tag" data-t="1.5" data-fx="pop" data-r="-3" style="left:470px;top:900px;width:420px;height:300px"><span class="num">۳</span>اجرت</div>
</div>

<!-- 3. karat: under the loupe -->
<div class="sc" data-a="11.1" data-b="17.1">
  <div class="paper torn" data-t="0.1" data-fx="left" data-r="-3" style="left:110px;top:380px;width:860px;height:820px">
    <div class="tag" style="inset:0"><div style="text-align:center"><div style="font:600 40px/1 Vazirmatn;color:#6b5636;margin-bottom:30px">روی فاکتور</div>
      <div style="font:700 250px/1 'LG Naskh';color:#0f3524">۷۵۰</div><small>یعنی ۱۸ عیار</small></div></div>
  </div>
  <svg id="loupe" width="420" height="420" viewBox="0 0 100 100" style="position:absolute;left:300px;top:520px">
    <circle cx="40" cy="40" r="28" fill="rgba(255,255,255,.12)" stroke="#c9a24e" stroke-width="7"/><path d="M60 60 L88 88" stroke="#6b4a1e" stroke-width="12" stroke-linecap="round"/></svg>
</div>

<!-- 4. weight: on the scale, in front of you -->
<div class="sc" data-a="17.1" data-b="22.6">
  <div class="paper torn" data-t="0.1" data-fx="right" data-r="3" style="left:140px;top:380px;width:800px;height:840px">
    <svg width="800" height="840" viewBox="0 0 200 210" style="position:absolute;inset:0">
      <rect x="40" y="150" width="120" height="26" rx="6" fill="#0f3524"/><rect x="58" y="156" width="84" height="14" rx="3" fill="#123d2a" stroke="#c9a24e" stroke-width="1"/>
      <text x="100" y="167" text-anchor="middle" font-family="Vazirmatn" font-weight="800" font-size="11" fill="#e8cf8e" id="scaleTxt">۰٫۰۰ g</text>
      <rect x="50" y="138" width="100" height="10" rx="4" fill="#9a8a6a"/>
      <g id="pan"><ellipse cx="100" cy="134" rx="46" ry="6" fill="#c9b994"/><image href="../img/earring-hearts-1.webp" x="72" y="70" width="56" height="70" preserveAspectRatio="xMidYMid slice"/></g>
      <text x="100" y="40" text-anchor="middle" font-family="Vazirmatn" font-weight="800" font-size="20" fill="#2a2116">وزن، جلوی چشم شما</text>
    </svg>
  </div>
</div>

<!-- 5. wage and profit written apart from the gold -->
<div class="sc" data-a="22.6" data-b="29.1">
  <div class="paper torn formula" data-t="0.1" data-fx="pop" data-r="-2" style="left:70px;top:420px;width:940px">
    <div style="font:700 44px/1 Vazirmatn;color:#6b5636;margin-bottom:24px">قیمت یک کار طلا</div>
    <b class="g" data-t="0.6" data-fx="pop">وزن × نرخ روز</b> +
    <b data-t="1.4" data-fx="pop">اجرت</b> +
    <b data-t="2.0" data-fx="pop">سود</b> +
    <b data-t="2.6" data-fx="pop">مالیات</b>
    <div style="font:600 36px/1.5 Vazirmatn;color:#6b5636;margin-top:24px" data-t="3.4">هر کدام جدا روی فاکتور</div>
  </div>
</div>

<!-- 6. any question: ask in a direct message -->
<div class="sc" data-a="29.1" data-b="34.1">
  <div class="paper torn" data-t="0.1" data-fx="up" data-r="2" style="left:250px;top:330px;width:580px;height:960px;background:linear-gradient(160deg,#0f3524,#07190f)">
    <div style="position:absolute;top:60px;left:0;right:0;text-align:center;font:700 34px/1 Cinzel;letter-spacing:.2em;color:#e8cf8e">DIRECT</div>
  </div>
  <div class="bub" data-t="0.8" data-fx="right" style="left:300px;top:520px;max-width:470px">سلام، این گوشواره چند عیاره؟</div>
  <div class="bub me" data-t="2.0" data-fx="left" style="right:300px;top:740px;max-width:470px;left:auto">سلام 🌿 عیار، وزن و اجرتش رو همین الان می‌فرستم</div>
</div>

<!-- 7. send it to someone who is about to buy -->
<div class="sc" data-a="34.1" data-b="38.6">
  <div class="cta">
    <img src="../img/leaf.png" alt="" data-t="0.1" data-fx="pop">
    <div class="n" data-t="0.6">LEON GOLD</div>
    <div class="pill" data-t="1.1" data-fx="pop">بفرست برای کسی که طلا می‌خره</div>
  </div>
</div>

<div id="cap"></div>
<div class="foot" dir="ltr">@___leongold___</div>

<script src="reel.js"></script>
<script>
window.LEN = 38.6;
window.CAPS = [
  [0.3, 2.9, "یه کار رو دیدی"], [2.9, 5.6, "و *دلت* رفت…"],
  [5.6, 8.3, "قبل از خرید"], [8.3, 11.1, "این *سه* تا رو بپرس"],
  [11.1, 14.1, "*عیار* روی فاکتور"], [14.1, 17.1, "۷۵۰ یعنی *۱۸* عیار"],
  [17.1, 19.9, "*وزن* با ترازو"], [19.9, 22.6, "جلوی *چشم* خودت"],
  [22.6, 25.8, "*اجرت* و سود"], [25.8, 29.1, "جدا از *طلا*"],
  [29.1, 31.6, "هر سؤالی داری"], [31.6, 34.1, "*دایرکت* بپرس"],
  [34.1, 38.6, "اینو برای *یکی* بفرست"],
];
// torn edges: a fixed jagged outline per sheet
let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
for (const el of document.querySelectorAll(".torn")) {
  const pts = [], n = 18, j = () => (rnd() * 1.8).toFixed(2);
  for (let i = 0; i <= n; i++) pts.push(`${(i * 100 / n).toFixed(1)}% ${j()}%`);
  for (let i = 1; i <= n; i++) pts.push(`${100 - j()}% ${(i * 100 / n).toFixed(1)}%`);
  for (let i = n - 1; i >= 0; i--) pts.push(`${(i * 100 / n).toFixed(1)}% ${100 - j()}%`);
  for (let i = n - 1; i > 0; i--) pts.push(`${j()}% ${(i * 100 / n).toFixed(1)}%`);
  el.style.clipPath = `polygon(${pts.join(",")})`;
}
const bg = document.getElementById("bgs");
for (let i = 0; i < 14; i++) { const e = document.createElement("i"); const w = 160 + rnd() * 260, h = 120 + rnd() * 220;
  Object.assign(e.style, { left: rnd() * 1000 - 80 + "px", top: rnd() * 1840 - 60 + "px", width: w + "px", height: h + "px", transform: `rotate(${rnd() * 40 - 20}deg)`, background: i % 3 ? "#1b3626" : "#3a2a17" });
  bg.appendChild(e); }
const gp = document.getElementById("gpath"), lp = document.getElementById("loupe"), st = document.getElementById("scaleTxt"), pan = document.getElementById("pan");
HOOKS.push(t => {
  // the path draws in the second scene, again at the direct message
  gp.style.strokeDashoffset = 1400 * (1 - R.ease(R.p(t, 6.0, 4))) + 1400 * R.ease(R.p(t, 27.6, 1.5)) * (1 - R.ease(R.p(t, 29.6, 3)));
  gp.style.opacity = t < 34.1 ? .9 * (1 - R.p(t, 33.6, .5)) : 0;
  // the loupe glides over the stamp
  const k = R.p(t, 11.6, 5), x = 230 + Math.sin(k * Math.PI * 1.5) * 200, y = 460 + Math.cos(k * Math.PI) * 60;
  lp.style.transform = `translate(${x - 300}px, ${y - 520}px)`; lp.style.opacity = R.ease(R.p(t, 11.4, .5)) * (1 - R.p(t, 16.8, .3));
  // the scale: the piece lands, the numbers run, then rest on «—» (no weight is claimed)
  const d = R.p(t, 17.8, .7); pan.setAttribute("transform", `translate(0 ${(1 - R.ease(d)) * -40 + Math.sin(R.p(t, 18.5, .8) * Math.PI * 3) * (1 - R.p(t, 18.5, .8)) * 3})`);
  const run = R.p(t, 18.5, 1.6); st.textContent = run <= 0 ? "۰٫۰۰ g" : run < 1 ? fa((Math.abs(Math.sin(t * 13)) * 9).toFixed(2)).replace(".", "٫") + " g" : "دقیق ✓";
});
</script>
</body>
</html>
