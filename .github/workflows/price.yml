# Copies the Tehran gold union 18k price into price.json on the "price" branch every 2 minutes.
# GitHub's own schedule fires late or not at all, so one run keeps looping for ~5h50m and the schedule only
# restarts it (a new run replaces the running one, so a changed script takes effect within ~30 minutes). The app reads price.json from
# raw.githubusercontent.com or jsDelivr (both CORS-open) and falls back to tgju if it is missing or stale.
name: gold price
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/**']
permissions:
  contents: write
concurrency:
  group: price
  cancel-in-progress: true
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - run: |
          S=$PWD/.github/scripts/price.py
          mkdir out && cd out && git init -q -b price
          git config user.name "leon-gold price" && git config user.email "actions@users.noreply.github.com"
          end=$((SECONDS+21000))
          while [ $SECONDS -lt $end ]; do
            if python3 "$S"; then
              git add price.json && git commit -q --amend -m price --allow-empty 2>/dev/null || git commit -qm price
              git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" price || true
              curl -s -m 20 -o /dev/null https://purge.jsdelivr.net/gh/${{ github.repository }}@price/price.json || true
            fi
            sleep 120
          done
